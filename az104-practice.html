<title>AZ-104 Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f4f6fa;
    --surface:#ffffff;
    --surface-2:#eef1f7;
    --border:#d8dee8;
    --text:#161a24;
    --text-dim:#5c6577;
    --accent:#2954d9;
    --accent-ink:#173a9e;
    --accent-soft:#e7ecfc;
    --good:#1c8a5e;
    --good-soft:#e3f5ec;
    --bad:#c8433a;
    --bad-soft:#fbe9e7;
    --warn:#b8791c;
    --warn-soft:#faf1de;
    --shadow: 0 1px 2px rgba(20,25,40,.04), 0 8px 24px -12px rgba(20,25,40,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1017;
      --surface:#151a24;
      --surface-2:#1c2230;
      --border:#2a3140;
      --text:#e8ebf3;
      --text-dim:#98a1b5;
      --accent:#6f95ff;
      --accent-ink:#c1d1ff;
      --accent-soft:#1c2647;
      --good:#49cf94;
      --good-soft:#132a22;
      --bad:#ff8077;
      --bad-soft:#301a1a;
      --warn:#f0b84a;
      --warn-soft:#2e2311;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1017;
    --surface:#151a24;
    --surface-2:#1c2230;
    --border:#2a3140;
    --text:#e8ebf3;
    --text-dim:#98a1b5;
    --accent:#6f95ff;
    --accent-ink:#c1d1ff;
    --accent-soft:#1c2647;
    --good:#49cf94;
    --good-soft:#132a22;
    --bad:#ff8077;
    --bad-soft:#301a1a;
    --warn:#f0b84a;
    --warn-soft:#2e2311;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Manrope', system-ui, sans-serif;
    font-weight:800;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  #app{ max-width:840px; margin:0 auto; padding:28px 20px 80px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px 26px; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg, var(--accent), var(--accent-ink));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'IBM Plex Mono'; font-weight:600; font-size:13px;
    flex:none;
  }
  .brand .name{ font-size:14px; font-weight:600; color:var(--text-dim); letter-spacing:.02em; }
  .brand .name b{ color:var(--text); font-weight:700; }
  .theme-toggle{
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .theme-toggle:hover{ color:var(--text); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow);
  }

  /* ---------- Setup screen ---------- */
  .hero{ padding:36px 34px 30px; }
  .hero .eyebrow{
    font-family:'IBM Plex Mono'; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:10px;
  }
  .hero h1{ font-size:30px; margin:0 0 8px; }
  .hero p{ color:var(--text-dim); font-size:14.5px; line-height:1.55; max-width:52ch; margin:0; }

  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; padding:0 34px 26px; }
  .stat-chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; min-width:104px;
  }
  .stat-chip .num{ font-family:'IBM Plex Mono'; font-weight:600; font-size:19px; }
  .stat-chip .lbl{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  .divider{ height:1px; background:var(--border); margin:0 34px; }

  .setup-body{ padding:26px 34px 34px; display:flex; flex-direction:column; gap:24px; }
  .field-label{ font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .field-label .hint{ font-weight:400; color:var(--text-dim); font-size:12px; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mode-card{
    border:1.5px solid var(--border); border-radius:12px; padding:14px 15px; cursor:pointer;
    background:var(--surface); transition:border-color .15s, background .15s;
  }
  .mode-card:hover{ border-color:var(--accent); }
  .mode-card.active{ border-color:var(--accent); background:var(--accent-soft); }
  .mode-card .title{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:7px; }
  .mode-card .desc{ font-size:12px; color:var(--text-dim); margin-top:4px; line-height:1.45; }

  .topic-grid{ display:flex; flex-direction:column; gap:7px; }
  .topic-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    border:1px solid var(--border); border-radius:9px; cursor:pointer; background:var(--surface);
  }
  .topic-row:hover{ background:var(--surface-2); }
  .topic-row input{ accent-color:var(--accent); width:15px; height:15px; flex:none; }
  .topic-row .t-name{ font-size:13px; font-weight:500; flex:1; }
  .topic-row .t-count{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-dim); }

  .count-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill-btn{
    border:1.5px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:'IBM Plex Mono';
  }
  .pill-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .switch{ position:relative; width:38px; height:22px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:.15s; }
  .slider:before{ content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  input:checked + .slider{ background:var(--accent); }
  input:checked + .slider:before{ transform:translateX(16px); }

  .start-btn{
    width:100%; border:none; border-radius:12px; padding:15px; font-size:15px; font-weight:700;
    background:var(--accent); color:#fff; cursor:pointer; font-family:'Manrope';
    box-shadow:var(--shadow);
  }
  .start-btn:hover{ background:var(--accent-ink); }
  .start-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .history{ padding:18px 34px 30px; }
  .history h3{ font-size:13px; color:var(--text-dim); font-weight:600; margin:0 0 10px; text-transform:uppercase; letter-spacing:.05em; }
  .hist-item{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .hist-item:last-child{ border-bottom:none; }
  .hist-score{ font-family:'IBM Plex Mono'; font-weight:600; }
  .hist-date{ color:var(--text-dim); font-size:11.5px; }

  /* ---------- Quiz screen ---------- */
  .quiz-top{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .progress-track{ flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
  .progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
  .quiz-meta{ font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--text-dim); white-space:nowrap; display:flex; gap:14px; }
  .timer{ color:var(--text); font-weight:600; }
  .timer.low{ color:var(--bad); }

  .q-card{ padding:30px 32px; }
  .q-tag-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .q-tag{
    font-family:'IBM Plex Mono'; font-size:11px; font-weight:600; letter-spacing:.03em;
    padding:4px 9px; border-radius:6px; background:var(--surface-2); color:var(--text-dim);
  }
  .q-tag.multi{ background:var(--warn-soft); color:var(--warn); }
  .flag-btn{
    margin-left:auto; border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    border-radius:7px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-weight:600;
    display:flex; align-items:center; gap:5px;
  }
  .flag-btn.flagged{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }

  .q-text{ font-size:16.5px; line-height:1.55; margin:0 0 22px; font-weight:500; }

  .opt{
    display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border:1.5px solid var(--border);
    border-radius:11px; margin-bottom:9px; cursor:pointer; font-size:14px; line-height:1.5; background:var(--surface);
    transition:border-color .12s, background .12s;
  }
  .opt:hover{ border-color:var(--accent); }
  .opt .letter{
    font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; width:22px;height:22px; border-radius:6px;
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center; flex:none;
    margin-top:1px;
  }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .opt.selected .letter{ background:var(--accent); color:#fff; }
  .opt.correct{ border-color:var(--good); background:var(--good-soft); }
  .opt.correct .letter{ background:var(--good); color:#fff; }
  .opt.incorrect{ border-color:var(--bad); background:var(--bad-soft); }
  .opt.incorrect .letter{ background:var(--bad); color:#fff; }
  .opt.locked{ cursor:default; }

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:10px; font-size:13.5px; line-height:1.55;
  }
  .feedback.ok{ background:var(--good-soft); color:var(--text); border:1px solid var(--good); }
  .feedback.no{ background:var(--bad-soft); color:var(--text); border:1px solid var(--bad); }
  .feedback .verdict{ font-weight:700; margin-bottom:5px; }
  .feedback .verdict.ok-text{ color:var(--good); }
  .feedback .verdict.no-text{ color:var(--bad); }
  .feedback .expl-empty{ color:var(--text-dim); font-style:italic; }

  .q-actions{ display:flex; gap:10px; padding:0 32px 28px; }
  .btn{
    border-radius:10px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:'Manrope';
    border:1.5px solid var(--border); background:var(--surface); color:var(--text);
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); margin-left:auto; }
  .btn.primary:hover{ background:var(--accent-ink); }
  .btn.ghost{ background:transparent; }

  .quiz-nav{ display:flex; gap:6px; flex-wrap:wrap; margin-top:18px; }
  .nav-dot{
    width:26px; height:26px; border-radius:7px; border:1.5px solid var(--border); background:var(--surface);
    font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .nav-dot.current{ border-color:var(--accent); color:var(--accent); font-weight:700; }
  .nav-dot.answered{ background:var(--surface-2); color:var(--text); }
  .nav-dot.flagged{ box-shadow:0 0 0 2px var(--warn) inset; }
  .nav-dot.correct{ background:var(--good-soft); color:var(--good); border-color:var(--good); }
  .nav-dot.incorrect{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad); }

  /* ---------- Results ---------- */
  .results-hero{ padding:38px 34px 28px; text-align:center; }
  .score-ring{ margin:0 auto 18px; }
  .score-big{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:600; }
  .results-hero h2{ font-size:24px; margin:2px 0 6px; }
  .results-hero p{ color:var(--text-dim); font-size:13.5px; margin:0; }
  .pass{ color:var(--good); }
  .fail{ color:var(--bad); }

  .breakdown{ padding:8px 34px 8px; display:flex; flex-direction:column; gap:10px; }
  .bd-row{ display:flex; align-items:center; gap:12px; }
  .bd-name{ font-size:12.5px; color:var(--text-dim); width:150px; flex:none; }
  .bd-track{ flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
  .bd-fill{ height:100%; border-radius:99px; }
  .bd-val{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-dim); width:44px; text-align:right; flex:none; }

  .result-actions{ display:flex; gap:10px; padding:26px 34px 30px; flex-wrap:wrap; }

  .review-list{ padding:6px 20px 30px; display:flex; flex-direction:column; gap:12px; }
  .review-filter{ display:flex; gap:8px; padding:20px 34px 6px; }
  .rf-btn{
    border:1.5px solid var(--border); background:var(--surface); border-radius:999px; padding:6px 14px;
    font-size:12px; font-weight:600; cursor:pointer; color:var(--text-dim);
  }
  .rf-btn.active{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }

  .rev-item{ border:1px solid var(--border); border-radius:12px; padding:18px 20px; background:var(--surface); }
  .rev-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .rev-badge{ font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; }
  .rev-badge.ok{ background:var(--good-soft); color:var(--good); }
  .rev-badge.no{ background:var(--bad-soft); color:var(--bad); }
  .rev-topic{ font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono'; }
  .rev-q{ font-size:14.5px; font-weight:500; margin-bottom:12px; line-height:1.5; }
  .rev-opts{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .rev-opt{ font-size:13px; padding:8px 11px; border-radius:8px; border:1px solid var(--border); display:flex; gap:8px; }
  .rev-opt .letter{ font-family:'IBM Plex Mono'; font-weight:600; font-size:11.5px; color:var(--text-dim); }
  .rev-opt.correct{ background:var(--good-soft); border-color:var(--good); }
  .rev-opt.incorrect{ background:var(--bad-soft); border-color:var(--bad); }
  .rev-expl{ font-size:12.5px; color:var(--text-dim); line-height:1.55; background:var(--surface-2); border-radius:8px; padding:11px 13px; }

  footer.note{ text-align:center; color:var(--text-dim); font-size:11.5px; padding:20px 10px 0; line-height:1.6; }

  [hidden]{ display:none !important; }

  @media (max-width:560px){
    .hero{ padding:28px 20px 22px; } .stat-row,.setup-body,.divider,.history{ padding-left:20px; padding-right:20px; }
    .q-card{ padding:24px 20px; } .q-actions{ padding:0 20px 24px; }
    .mode-grid{ grid-template-columns:1fr; }
    .results-hero,.breakdown,.result-actions,.review-filter{ padding-left:20px; padding-right:20px; }
    .review-list{ padding-left:14px; padding-right:14px; }
  }
</style>

ure that all the virtual machines for App1 are protected by backups. References: https://docs.microsoft.com/en-us/azure/backup/quick-backup-vm-portal"}, {"num": "16", "topic": "2", "topicTitle": "Contoso LtdOverview", "question": "You need to move the blueprint files to Azure. What should you do?", "options": {"A": "Generate a shared access signature (SAS). Map a drive, and then copy the files by using File Explorer.", "B": "Use the Azure Import/Export service.", "C": "Generate an access key. Map a drive, and then copy the files by using File Explorer.", "D": "Use Azure Storage Explorer to copy the files."}, "answer": ["D"], "explanation": "Azure Storage Explorer is a free tool from Microsoft that allows you to work with Azure Storage data on Windows, macOS, and Linux. You can use it to upload and download data from Azure blob storage. Scenario: Planned Changes include: move the existing product blueprint files to Azure Blob storage. Technical Requirements include: Copy the blueprint files to Azure over the Internet."}, {"num": "17", "topic": "2", "topicTitle": "Contoso LtdOverview", "question": "You are planning the move of App1 to Azure. You create a network security group (NSG). You need to recommend a solution to provide users with access to App1. What should you recommend?", "options": {"A": "Create an outgoing security rule for port 443 from the Internet. Associate the NSG to all the subnets.", "B": "Create an incoming security rule for port 443 from the Internet. Associate the NSG to all the subnets.", "C": "Create an incoming security rule for port 443 from the Internet. Associate the NSG to the subnet that contains the web servers.", "D": "Create an outgoing security rule for port 443 from the Internet. Associate the NSG to the subnet that contains the web servers."}, "answer": ["C"], "explanation": "As App1 is public-facing we need an incoming security rule, related to the access of the web servers. Scenario: You have a public-facing application named App1 e Miami office and enable Pass-through Authentication", "E": "Install the Active Directory Federation Services (AD FS) role on a domain controller in the Miami office."}, "answer": ["B", "D"], "explanation": "Every Azure AD directory comes with an initial domain name in the form of domainname.onmicrosoft.com. The initial domain name cannot be changed or deleted, but you can add your corporate domain name to Azure AD as well. For example, your organization probably has other domain names used to do business and users who sign in using your corporate domain name. Adding custom domain names to Azure AD allows you to assign user names in the directory that are familiar to your users, such as ‘alice@contoso.com.’ instead of 'alice@domain name.onmicrosoft.com'. Scenario: Network Infrastructure: Each office has a local data center that contains all the servers for that office. Each office has a dedicated connection to the Internet. Humongous Insurance has a single-domain Active Directory forest named humongousinsurance.com Planned Azure AD Infrastructure: The on-premises Active Directory domain will"}, {"num": "32", "topic": "4", "topicTitle": "Humongous InsuranceOverview", "question": "You need to resolve the licensing issue before you attempt to assign the license again. What should you do?", "options": {"A": "From the Groups blade, invite the user accounts to a new group.", "B": "From the Profile blade, modify the usage location.", "C": "From the Directory role blade, modify the directory role."}, "answer": ["B"], "explanation": "Scenario: Licensing Issue * 1. You attempt to assign a license in Azure to several users and receive the following error message: \"Licenses not assigned. License agreement failed for one user.\" * 2. You verify that the Azure subscription has the available licenses. Solution: License cannot be assigned to a user without a usage location specified. Some Microsoft services aren't available in all locations because of local laws and regulations. roups and conditional access policies"}, "answer": ["D"], "explanation": "Technically, The finance department needs to migrate their users from AD to AAD using AADC based on the finance OU, and need to enforce MFA use. This is conditional access policy. Employees also often get promotions and/or join other departments and when that occurs, the user's OU attribute will change when the admin puts the user in a new OU, and the dynamic group conditional access exception (OU= [Department Name Value]) will move the user to the appropriate dynamic group on next AADC delta sync. https://docs.microsoft.com/en-us/azure/active-directory/enterprise-users/groups-dynamic- membership https://docs.microsoft.com/en-us/azure/active-directory/conditional-access/overview https://docs.microsoft.com/en-us/azure/active-directory/authentication/howto-mfa- userstates"}, {"num": "41", "topic": "5", "topicTitle": "Litware, inc.Overview", "question": "You need to meet the technical requirement for VM4. What should you create and configure?", "options": {"A": "an Azure Notification Hub", "B": "an Azure Event Hub", "C": "an Azure Logic App", "D": "an Azure services Bus"}, "answer": ["B"], "explanation": "Scenario: Create a workflow to send an email message when the settings of VM4 are modified. You can start an automated logic app workflow when specific events happen in Azure resources or third-party resources. These resources can publish those events to an Azure event grid. In turn, the event grid pushes those events to subscribers that have queues, webhooks, or event hubs as endpoints. As a subscriber, your logic app can wait for those events from the event grid before running automated workflows to perform tasks - without you writing any code."}, {"num": "43", "topic": "5", "topicTitle": "Litware, inc.Overview", "question": "You need to ensure that VM1 can communicate with VM4. The solution must minimize administrative effort. What should you do?", "options": {"A": "Create a user-defined rout <script>
(function(){
  "use strict";

  var ALL_Q = JSON.parse(document.getElementById('qdata').textContent);
  var TOPIC_NAMES = {};
  ALL_Q.forEach(function(q){
    if(!TOPIC_NAMES[q.topic]) TOPIC_NAMES[q.topic] = q.topicTitle || ("Topic " + q.topic);
  });
  var TOPIC_ORDER = Object.keys(TOPIC_NAMES).sort(function(a,b){ return (+a)-(+b); });

  var app = document.getElementById('app');
  var PASS_PCT = 70;

  var state = {
    screen: 'setup',
    mode: 'practice',
    selectedTopics: TOPIC_ORDER.slice(),
    count: 40,
    shuffleOptions: true,
    quiz: null
  };

  function loadHistory(){
    try{
      var raw = localStorage.getItem('az104_history');
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveHistoryEntry(entry){
    try{
      var h = loadHistory();
      h.unshift(entry);
      h = h.slice(0, 8);
      localStorage.setItem('az104_history', JSON.stringify(h));
    }catch(e){}
  }
  function loadTheme(){
    try{ return localStorage.getItem('az104_theme'); }catch(e){ return null; }
  }
  function saveTheme(t){
    try{ localStorage.setItem('az104_theme', t); }catch(e){}
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function countForTopics(topics){
    return ALL_Q.filter(function(q){ return topics.indexOf(q.topic) !== -1; }).length;
  }

  function applyTheme(){
    var t = loadTheme();
    if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }
  applyTheme();

  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var effectiveDark = cur ? cur === 'dark' : prefersDark;
    var next = effectiveDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    saveTheme(next);
    render();
  }

  function topbar(){
    return '<div class="topbar">' +
      '<div class="brand"><div class="mark">104</div><div class="name"><b>AZ-104</b> Practice Exam</div></div>' +
      '<button class="theme-toggle" id="themeBtn">Toggle theme</button>' +
    '</div>';
  }

  /* ---------------- Setup Screen ---------------- */
  function renderSetup(){
    var totalQ = ALL_Q.length;
    var history = loadHistory();

    var topicRows = TOPIC_ORDER.map(function(t){
      var n = TOPIC_NAMES[t];
      var c = ALL_Q.filter(function(q){ return q.topic===t; }).length;
      var checked = state.selectedTopics.indexOf(t) !== -1;
      return '<label class="topic-row"><input type="checkbox" data-topic="'+t+'" '+(checked?'checked':'')+'>' +
        '<span class="t-name">' + esc(n) + '</span>' +
        '<span class="t-count">' + c + ' q</span></label>';
    }).join('');

    var maxAvail = countForTopics(state.selectedTopics);
    var counts = [10,20,40,maxAvail].filter(function(v,i,a){ return v>0 && a.indexOf(v)===i; }).sort(function(a,b){return a-b;});

    var countBtns = counts.map(function(c){
      var label = c===maxAvail ? 'All ('+c+')' : String(c);
      return '<button class="pill-btn '+(state.count===c?'active':'')+'" data-count="'+c+'">'+label+'</button>';
    }).join('');

    var histHtml = '';
    if(history.length){
      histHtml = '<div class="divider"></div><div class="history"><h3>Recent attempts</h3>' +
        history.map(function(h){
          var d = new Date(h.date);
          return '<div class="hist-item"><span>'+ h.pct +'% <span class="hist-score">('+h.correct+'/'+h.total+')</span></span>' +
            '<span class="hist-date">'+ d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + esc(h.mode) +'</span></div>';
        }).join('') + '</div>';
    }

    app.innerHTML = topbar() +
      '<div class="card">' +
        '<div class="hero">' +
          '<div class="eyebrow">Microsoft Certified · Azure Administrator</div>' +
          '<h1>AZ-104 Practice Exam</h1>' +
          '<p>Built from your exam-dump PDF: '+totalQ+' scenario and standalone questions across six exam domains. Pick a mode, choose your scope, and start testing yourself.</p>' +
        '</div>' +
        '<div class="stat-row">' +
          '<div class="stat-chip"><div class="num mono">'+totalQ+'</div><div class="lbl">Total questions</div></div>' +
          '<div class="stat-chip"><div class="num mono">'+TOPIC_ORDER.length+'</div><div class="lbl">Exam domains</div></div>' +
          '<div class="stat-chip"><div class="num mono">'+PASS_PCT+'%</div><div class="lbl">Passing score</div></div>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="setup-body">' +
          '<div>' +
            '<div class="field-label">Mode</div>' +
            '<div class="mode-grid">' +
              '<div class="mode-card '+(state.mode==='practice'?'active':'')+'" data-mode="practice">' +
                '<div class="title">📘 Practice</div><div class="desc">Instant feedback and explanations after each question. No time limit.</div></div>' +
              '<div class="mode-card '+(state.mode==='exam'?'active':'')+'" data-mode="exam">' +
                '<div class="title">⏱ Timed Exam</div><div class="desc">Answers hidden until you submit. 90 seconds per question, scored at the end.</div></div>' +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="field-label">Domains <span class="hint">'+state.selectedTopics.length+' of '+TOPIC_ORDER.length+' selected</span></div>' +
            '<div class="topic-grid">' + topicRows + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="field-label">Question count</div>' +
            '<div class="count-row">' + countBtns + '</div>' +
          '</div>' +
          '<div class="toggle-row">' +
            '<div><div class="field-label" style="margin-bottom:2px">Shuffle answer order</div><div class="hint" style="font-size:12px;color:var(--text-dim)">Randomize option order per question</div></div>' +
            '<label class="switch"><input type="checkbox" id="shuffleOpt" '+(state.shuffleOptions?'checked':'')+'><span class="slider"></span></label>' +
          '</div>' +
          '<button class="start-btn" id="startBtn" '+(maxAvail===0?'disabled':'')+'>Start test →</button>' +
        '</div>' +
        histHtml +
      '</div>' +
      '<footer class="note">Content extracted from your uploaded exam-dump PDF for personal study use.<br>Scoring uses a 70% pass threshold, matching the real AZ-104 exam.</footer>';

    document.getElementById('themeBtn').onclick = toggleTheme;
    document.querySelectorAll('.mode-card').forEach(function(el){
      el.onclick = function(){ state.mode = el.getAttribute('data-mode'); render(); };
    });
    document.querySelectorAll('.topic-row input').forEach(function(el){
      el.onchange = function(){
        var t = el.getAttribute('data-topic');
        var idx = state.selectedTopics.indexOf(t);
        if(el.checked && idx===-1) state.selectedTopics.push(t);
        if(!el.checked && idx!==-1) state.selectedTopics.splice(idx,1);
        var avail = countForTopics(state.selectedTopics);
        if(state.count > avail) state.count = avail;
        render();
      };
    });
    document.querySelectorAll('.pill-btn').forEach(function(el){
      el.onclick = function(){ state.count = parseInt(el.getAttribute('data-count'),10); render(); };
    });
    document.getElementById('shuffleOpt').onchange = function(e){ state.shuffleOptions = e.target.checked; };
    var startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.onclick = startQuiz;
  }

  /* ---------------- Quiz logic ---------------- */
  function startQuiz(){
    var pool = ALL_Q.filter(function(q){ return state.selectedTopics.indexOf(q.topic)!==-1; });
    pool = shuffle(pool).slice(0, state.count);
    var questions = pool.map(function(q){
      var letters = Object.keys(q.options);
      var order = state.shuffleOptions ? shuffle(letters) : letters;
      return {
        ref: q,
        order: order,
        selected: [],
        checked: false,
        flagged: false
      };
    });
    state.quiz = {
      questions: questions,
      idx: 0,
      mode: state.mode,
      startedAt: Date.now(),
      secondsLeft: state.mode==='exam' ? questions.length * 90 : null,
      timerHandle: null,
      finished: false
    };
    state.screen = 'quiz';
    render();
    if(state.quiz.mode === 'exam') startTimer();
  }

  function startTimer(){
    stopTimer();
    state.quiz.timerHandle = setInterval(function(){
      if(!state.quiz) return;
      state.quiz.secondsLeft--;
      if(state.quiz.secondsLeft <= 0){
        state.quiz.secondsLeft = 0;
        stopTimer();
        finishQuiz();
        return;
      }
      updateTimerDisplay();
    }, 1000);
  }
  function stopTimer(){
    if(state.quiz && state.quiz.timerHandle){ clearInterval(state.quiz.timerHandle); state.quiz.timerHandle=null; }
  }
  function updateTimerDisplay(){
    var el = document.getElementById('timerVal');
    if(!el || !state.quiz) return;
    var s = state.quiz.secondsLeft;
    var m = Math.floor(s/60), ss = s%60;
    el.textContent = m + ':' + (ss<10?'0':'') + ss;
    el.parentElement.classList.toggle('low', s < 60);
  }

  function currentQ(){ return state.quiz.questions[state.quiz.idx]; }

  function isMulti(q){ return q.ref.answer.length > 1; }

  function toggleSelect(letter){
    var q = currentQ();
    if(state.quiz.mode === 'practice' && q.checked) return;
    if(isMulti(q)){
      var i = q.selected.indexOf(letter);
      if(i===-1) q.selected.push(letter); else q.selected.splice(i,1);
    } else {
      q.selected = [letter];
    }
    render();
  }

  function checkAnswer(){
    var q = currentQ();
    if(q.selected.length===0) return;
    q.checked = true;
    render();
  }

  function goTo(i){
    if(i<0 || i>=state.quiz.questions.length) return;
    state.quiz.idx = i;
    render();
  }

  function toggleFlag(){
    currentQ().flagged = !currentQ().flagged;
    render();
  }

  function isAnswered(q){ return q.selected.length>0; }
  function isCorrect(q){
    var correct = q.ref.answer.slice().sort();
    var sel = q.selected.slice().sort();
    return correct.length===sel.length && correct.every(function(v,i){ return v===sel[i]; });
  }

  function finishQuiz(){
    stopTimer();
    state.quiz.finished = true;
    var total = state.quiz.questions.length;
    var correct = state.quiz.questions.filter(isCorrect).length;
    var pct = total ? Math.round(correct/total*100) : 0;
    saveHistoryEntry({ date: Date.now(), correct: correct, total: total, pct: pct, mode: state.quiz.mode });
    state.screen = 'results';
    state.reviewFilter = 'all';
    render();
  }

  function renderQuiz(){
    var quiz = state.quiz;
    var q = currentQ();
    var total = quiz.questions.length;
    var answeredCount = quiz.questions.filter(isAnswered).length;
    var showFeedback = quiz.mode==='practice' && q.checked;

    var optsHtml = q.order.map(function(letter){
      var text = q.ref.options[letter];
      var cls = 'opt';
      var selected = q.selected.indexOf(letter)!==-1;
      if(selected) cls += ' selected';
      if(showFeedback){
        cls += ' locked';
        var isCorrectOpt = q.ref.answer.indexOf(letter)!==-1;
        if(isCorrectOpt) cls += ' correct';
        else if(selected) cls += ' incorrect';
      }
      var inputType = isMulti(q) ? 'checkbox' : 'radio';
      return '<div class="'+cls+'" data-letter="'+letter+'">' +
        '<span class="letter">'+letter+'</span>' +
        '<span>' + esc(text) + '</span>' +
      '</div>';
    }).join('');

    var feedbackHtml = '';
    if(showFeedback){
      var ok = isCorrect(q);
      var correctLetters = q.ref.answer.join(', ');
      feedbackHtml = '<div class="feedback '+(ok?'ok':'no')+'">' +
        '<div class="verdict '+(ok?'ok-text':'no-text')+'">' + (ok ? '✓ Correct' : '✗ Incorrect — correct answer: ' + correctLetters) + '</div>' +
        (q.ref.explanation ? esc(q.ref.explanation) : '<span class="expl-empty">No explanation available in the source material for this question.</span>') +
      '</div>';
    }

    var navDots = quiz.questions.map(function(qq, i){
      var cls = 'nav-dot';
      if(i===quiz.idx) cls += ' current';
      if(qq.flagged) cls += ' flagged';
      if(quiz.mode==='practice' && qq.checked){
        cls += isCorrect(qq) ? ' correct' : ' incorrect';
      } else if(isAnswered(qq)){
        cls += ' answered';
      }
      return '<div class="'+cls+'" data-goto="'+i+'">'+(i+1)+'</div>';
    }).join('');

    var isLast = quiz.idx === total-1;
    var canCheck = quiz.mode==='practice' && !q.checked;
    var nextLabel = isLast ? (quiz.mode==='practice' ? 'Finish' : 'Submit test') : 'Next';

    var timerHtml = quiz.mode==='exam' ? '<span>⏱ <span id="timerVal" class="timer mono"></span></span>' : '';

    app.innerHTML = topbar() +
      '<div class="quiz-top">' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round((quiz.idx+1)/total*100)+'%"></div></div>' +
        '<div class="quiz-meta">' +
          '<span>' + (quiz.idx+1) + ' / ' + total + '</span>' +
          '<span>' + answeredCount + ' answered</span>' +
          timerHtml +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="q-card">' +
          '<div class="q-tag-row">' +
            '<span class="q-tag">' + esc(TOPIC_NAMES[q.ref.topic]) + '</span>' +
            (isMulti(q) ? '<span class="q-tag multi">SELECT ' + q.ref.answer.length + '</span>' : '') +
            '<button class="flag-btn '+(q.flagged?'flagged':'')+'" id="flagBtn">' + (q.flagged?'🚩 Flagged':'🏳 Flag') + '</button>' +
          '</div>' +
          '<p class="q-text">' + esc(q.ref.question) + '</p>' +
          '<div id="optsWrap">' + optsHtml + '</div>' +
          feedbackHtml +
        '</div>' +
        '<div class="q-actions">' +
          '<button class="btn ghost" id="prevBtn" '+(quiz.idx===0?'disabled':'')+'>← Previous</button>' +
          (canCheck ? '<button class="btn primary" id="checkBtn" '+(q.selected.length===0?'disabled':'')+'>Check answer</button>' : '') +
          (!canCheck ? '<button class="btn primary" id="nextBtn">' + nextLabel + '</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="quiz-nav">' + navDots + '</div>';

    if(quiz.mode==='exam') updateTimerDisplay();

    document.getElementById('themeBtn').onclick = toggleTheme;
    document.getElementById('flagBtn').onclick = toggleFlag;
    document.querySelectorAll('.opt').forEach(function(el){
      el.onclick = function(){
        if(el.classList.contains('locked')) return;
        toggleSelect(el.getAttribute('data-letter'));
      };
    });
    var prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.onclick = function(){ goTo(quiz.idx-1); };
    var checkBtn = document.getElementById('checkBtn');
    if(checkBtn) checkBtn.onclick = checkAnswer;
    var nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = function(){
      if(isLast) finishQuiz(); else goTo(quiz.idx+1);
    };
    document.querySelectorAll('.nav-dot').forEach(function(el){
      el.onclick = function(){ goTo(parseInt(el.getAttribute('data-goto'),10)); };
    });
  }

  /* ---------------- Results ---------------- */
  function renderResults(){
    var quiz = state.quiz;
    var total = quiz.questions.length;
    var correct = quiz.questions.filter(isCorrect).length;
    var pct = total ? Math.round(correct/total*100) : 0;
    var passed = pct >= PASS_PCT;

    var r = 52, c = 2*Math.PI*r;
    var offset = c - (pct/100)*c;
    var ringColor = passed ? 'var(--good)' : 'var(--bad)';
    var ringSvg = '<svg width="132" height="132" viewBox="0 0 132 132" class="score-ring">' +
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="12"/>' +
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+ringColor+'" stroke-width="12" stroke-linecap="round" ' +
        'stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 66 66)"/>' +
      '<text x="66" y="61" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="26" fill="var(--text)">'+pct+'%</text>' +
      '<text x="66" y="80" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="var(--text-dim)">'+correct+' / '+total+'</text>' +
    '</svg>';

    var byTopic = {};
    quiz.questions.forEach(function(q){
      var t = q.ref.topic;
      if(!byTopic[t]) byTopic[t] = {correct:0,total:0};
      byTopic[t].total++;
      if(isCorrect(q)) byTopic[t].correct++;
    });
    var breakdownHtml = Object.keys(byTopic).sort(function(a,b){return (+a)-(+b);}).map(function(t){
      var b = byTopic[t];
      var p = Math.round(b.correct/b.total*100);
      var color = p>=70 ? 'var(--good)' : (p>=40 ? 'var(--warn)' : 'var(--bad)');
      return '<div class="bd-row">' +
        '<div class="bd-name">' + esc(TOPIC_NAMES[t]) + '</div>' +
        '<div class="bd-track"><div class="bd-fill" style="width:'+p+'%;background:'+color+'"></div></div>' +
        '<div class="bd-val mono">'+b.correct+'/'+b.total+'</div>' +
      '</div>';
    }).join('');

    var filter = state.reviewFilter || 'all';
    var reviewQs = quiz.questions.filter(function(q){
      if(filter==='incorrect') return !isCorrect(q);
      if(filter==='flagged') return q.flagged;
      return true;
    });

    var reviewHtml = reviewQs.map(function(q){
      var ok = isCorrect(q);
      var optsHtml = q.order.map(function(letter){
        var isCorrectOpt = q.ref.answer.indexOf(letter)!==-1;
        var wasSelected = q.selected.indexOf(letter)!==-1;
        var cls = 'rev-opt';
        if(isCorrectOpt) cls += ' correct';
        else if(wasSelected) cls += ' incorrect';
        return '<div class="'+cls+'"><span class="letter">'+letter+(wasSelected?' •':'')+'</span><span>'+esc(q.ref.options[letter])+'</span></div>';
      }).join('');
      return '<div class="rev-item">' +
        '<div class="rev-head">' +
          '<span class="rev-badge '+(ok?'ok':'no')+'">'+(ok?'CORRECT':'MISSED')+'</span>' +
          '<span class="rev-topic">'+esc(TOPIC_NAMES[q.ref.topic])+'</span>' +
          (q.flagged?'<span class="rev-topic">🚩</span>':'') +
        '</div>' +
        '<div class="rev-q">'+esc(q.ref.question)+'</div>' +
        '<div class="rev-opts">'+optsHtml+'</div>' +
        (q.ref.explanation ? '<div class="rev-expl">'+esc(q.ref.explanation)+'</div>' : '') +
      '</div>';
    }).join('') || '<p style="color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;">Nothing to show for this filter.</p>';

    var incorrectCount = quiz.questions.filter(function(q){return !isCorrect(q);}).length;
    var flaggedCount = quiz.questions.filter(function(q){return q.flagged;}).length;

    app.innerHTML = topbar() +
      '<div class="card">' +
        '<div class="results-hero">' +
          ringSvg +
          '<h2 class="'+(passed?'pass':'fail')+'">' + (passed ? 'Passing score' : 'Below passing score') + '</h2>' +
          '<p>Real AZ-104 exams require roughly ' + PASS_PCT + '% to pass. ' + (passed ? 'Nice work — keep this consistent under exam conditions.' : 'Review the missed questions below, then try again.') + '</p>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="breakdown" style="padding-top:22px;">' + breakdownHtml + '</div>' +
        '<div class="result-actions">' +
          '<button class="btn primary" id="retryMissedBtn" '+(incorrectCount===0?'disabled':'')+'>Retry ' + incorrectCount + ' missed</button>' +
          '<button class="btn" id="restartBtn">New test</button>' +
        '</div>' +
      '</div>' +
      '<div class="card" style="margin-top:18px;">' +
        '<div class="review-filter">' +
          '<button class="rf-btn '+(filter==='all'?'active':'')+'" data-f="all">All ('+total+')</button>' +
          '<button class="rf-btn '+(filter==='incorrect'?'active':'')+'" data-f="incorrect">Missed ('+incorrectCount+')</button>' +
          '<button class="rf-btn '+(filter==='flagged'?'active':'')+'" data-f="flagged">Flagged ('+flaggedCount+')</button>' +
        '</div>' +
        '<div class="review-list">' + reviewHtml + '</div>' +
      '</div>' +
      '<footer class="note">Attempt saved locally on this device only.</footer>';

    document.getElementById('themeBtn').onclick = toggleTheme;
    document.getElementById('restartBtn').onclick = function(){ state.screen='setup'; state.quiz=null; render(); };
    document.getElementById('retryMissedBtn').onclick = function(){
      var missed = quiz.questions.filter(function(q){ return !isCorrect(q); }).map(function(q){ return q.ref; });
      var questions = missed.map(function(qr){
        var letters = Object.keys(qr.options);
        var order = state.shuffleOptions ? shuffle(letters) : letters;
        return { ref: qr, order: order, selected: [], checked:false, flagged:false };
      });
      state.quiz = { questions: questions, idx:0, mode: state.mode, startedAt: Date.now(),
        secondsLeft: state.mode==='exam' ? questions.length*90 : null, timerHandle:null, finished:false };
      state.screen = 'quiz';
      render();
      if(state.quiz.mode==='exam') startTimer();
    };
    document.querySelectorAll('.rf-btn').forEach(function(el){
      el.onclick = function(){ state.reviewFilter = el.getAttribute('data-f'); render(); };
    });
  }

  function render(){
    if(state.screen==='setup') renderSetup();
    else if(state.screen==='quiz') renderQuiz();
    else if(state.screen==='results') renderResults();
  }

  render();
})();
</script>
